name: HIL

# Flashes every board on the bench Pi with this PR's firmware and boots it
# against every game config. Recovery first, then flash + health check, then
# the config matrix (dev/hil/DESIGN.md §7).
#
# A plain pull_request workflow, so the result is this PR's own "HIL / Bench"
# check. It runs on PRs that are ready for review, from branches in this
# repo. Drafts and forks are skipped: a pull_request run executes the PR's
# own copy of this file and dev/hil/**, so only people who can already push
# here get to run code on the Pi. A maintainer can still run any ref by hand
# with workflow_dispatch.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      stages:
        description: "Which stages to run: all, recover, flash-check, config-matrix"
        type: string
        default: "all"
      target:
        description: "Limit the config matrix to one target, e.g. wpc (blank = all attached boards)"
        type: string
        default: ""
      configs:
        description: "Comma-separated config names for the matrix instead of all of them"
        type: string
        default: ""
      limit:
        description: "Stop the matrix after this many configs per board"
        type: string
        default: ""

# One run per PR: a new push replaces that PR's older run, queued or not, and
# never touches another PR's. Runs from different PRs simply wait their turn
# for the bench, because there is one runner with the vector-hil label and it
# takes one job at a time. Deliberately no bench-wide group: GitHub keeps only
# one *pending* run per group, so a shared group cancelled every waiting run
# but the newest.
concurrency:
  group: hil-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # How long the bench job may sit queued before the run is cancelled. Without
  # this a run waits up to 24 hours for a Pi that is offline.
  PICKUP_TIMEOUT_MINUTES: 15

jobs:
  bench:
    name: Bench
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, vector-hil]

    # A healthy run is about 50 minutes; this only catches a wedged one.
    timeout-minutes: 90

    steps:
      # Shallow: a full-history fetch is the step that hung on the Zero 2 W.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10

      - name: Prepare environment
        run: |
          test -x "$VECTOR_HIL_VENV/bin/python" || { echo "bench venv missing"; exit 1; }
          echo "$VECTOR_HIL_VENV/bin" >> "$GITHUB_PATH"

      # DESIGN.md's G1-G3. Self-healing recovery, then a USB+HTTP health
      # check, then every game config on every board.
      - name: Recover any wedged board
        timeout-minutes: 15
        id: recover
        if: contains(inputs.stages || 'all', 'all') || contains(inputs.stages || '', 'recover')
        continue-on-error: true
        run: python dev/hil/recover.py

      - name: Flash and health-check every board
        timeout-minutes: 25
        id: flash_check
        if: contains(inputs.stages || 'all', 'all') || contains(inputs.stages || '', 'flash-check')
        continue-on-error: true
        run: python dev/hil/flash_and_check.py

      - name: Boot every config on every board
        timeout-minutes: 70
        id: config_matrix
        if: contains(inputs.stages || 'all', 'all') || contains(inputs.stages || '', 'config-matrix')
        continue-on-error: true
        env:
          HIL_TARGET: ${{ inputs.target }}
          HIL_CONFIGS: ${{ inputs.configs }}
          HIL_LIMIT: ${{ inputs.limit }}
        run: |
          # An array, not a word-split string, so "Taxi_L4, AttackMars_11"
          # survives as one --configs value.
          args=()
          if [ -n "${HIL_TARGET:-}" ]; then args+=(--target "$HIL_TARGET"); fi
          if [ -n "${HIL_CONFIGS:-}" ]; then args+=(--configs "$HIL_CONFIGS"); fi
          if [ -n "${HIL_LIMIT:-}" ]; then args+=(--limit "$HIL_LIMIT"); fi

          python dev/hil/config_matrix.py "${args[@]}"

      - name: Board serial logs on failure
        timeout-minutes: 5
        if: failure() || steps.flash_check.outcome == 'failure' || steps.config_matrix.outcome == 'failure'
        run: |
          # stty raw -echo first, both under `timeout`: a tty re-echoes once
          # every handle closes, and opening one can block on carrier.
          for dev in /dev/ttyACM*; do
            [ -e "$dev" ] || continue
            echo "--- $dev"
            timeout 5 stty -F "$dev" raw -echo 115200 || true
            timeout 8 cat "$dev" || true
          done

      - name: Verdict
        if: always()
        env:
          RECOVER: ${{ steps.recover.outcome }}
          FLASH_CHECK: ${{ steps.flash_check.outcome }}
          CONFIG_MATRIX: ${{ steps.config_matrix.outcome }}
        run: |
          {
            echo "### HIL stages"
            echo
            echo "| stage | result |"
            echo "|---|---|"
            echo "| recover | ${RECOVER:-skipped} |"
            echo "| flash + health check | ${FLASH_CHECK:-skipped} |"
            echo "| config matrix | ${CONFIG_MATRIX:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "recover:       ${RECOVER:-skipped}"
          echo "flash-check:   ${FLASH_CHECK:-skipped}"
          echo "config-matrix: ${CONFIG_MATRIX:-skipped}"

          # Every stage runs even after an earlier failure, so the verdict is
          # taken here rather than at the first one.
          failed=0
          for outcome in "$RECOVER" "$FLASH_CHECK" "$CONFIG_MATRIX"; do
            [ "$outcome" = "failure" ] && failed=1
          done
          exit "$failed"

  # GitHub has no queue timeout for self-hosted jobs, so this stands in for
  # one: it watches the bench job from a GitHub-hosted runner and cancels the
  # run if the Pi has not picked it up in time. The bench check then reads
  # "cancelled" instead of sitting queued for a day. Waiting behind another
  # PR's bench run is not a missing Pi, so the clock restarts while one is
  # running.
  pickup-watchdog:
    name: Bench pickup watchdog
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Long enough to wait behind a few other PRs' runs.
    timeout-minutes: 360
    permissions:
      actions: write
    steps:
      - name: Wait for the bench to start
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          bench_status() {
            gh api "repos/$REPO/actions/runs/$1/attempts/$2/jobs" \
              --jq '.jobs[] | select(.name == "Bench") | .status' 2>/dev/null || true
          }

          # True when another HIL run has its bench job on the Pi right now.
          bench_busy_elsewhere() {
            local id attempt
            while read -r id attempt; do
              [ "$id" = "$RUN_ID" ] && continue
              [ "$(bench_status "$id" "$attempt")" = "in_progress" ] && return 0
            done < <(gh api "repos/$REPO/actions/workflows/hil.yml/runs?status=in_progress&per_page=20" \
              --jq '.workflow_runs[] | "\(.id) \(.run_attempt)"' 2>/dev/null || true)
            return 1
          }

          deadline=$(( $(date +%s) + PICKUP_TIMEOUT_MINUTES * 60 ))
          while :; do
            status=$(bench_status "$RUN_ID" "$ATTEMPT")
            case "$status" in
              in_progress|completed)
                echo "bench picked up (status: $status)"
                exit 0
                ;;
            esac
            if bench_busy_elsewhere; then
              deadline=$(( $(date +%s) + PICKUP_TIMEOUT_MINUTES * 60 ))
            elif [ "$(date +%s)" -ge "$deadline" ]; then
              break
            fi
            sleep 30
          done

          msg="No bench runner picked this up within ${PICKUP_TIMEOUT_MINUTES} minutes, so the run was cancelled. Check that the HIL Pi is online (Settings > Actions > Runners), then re-run."
          echo "::error::$msg"
          {
            echo "### HIL not run"
            echo
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"
          gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel"
          exit 1
