name: HIL config matrix

# Boots every attached board against every game config it can be flashed with,
# and checks that the board reports that config's game name. A config that
# fails to apply does not fault or crash - the board quietly comes up on the
# generic definition for its hardware - so the game name is the assertion that
# separates "loaded" from "silently fell back".
#
# This is DESIGN.md's G3. Runtime is dominated by the board with the most
# configs (WPC, 63) at roughly 15-25s per boot cycle, so a full run is well
# over half an hour; the inputs below exist to make a targeted run cheap.
#
# Deliberately no `pull_request` trigger - this targets a self-hosted runner on
# a private network and physically reflashes hardware. Fork gating is designed
# in dev/hil/DESIGN.md §4 and is not built yet.
#
# The `push` trigger exists so this can be validated before merging, since a
# workflow_dispatch workflow is not dispatchable until it reaches the default
# branch. Drop the push trigger once this is on main.
#
# It shares the `hil-bench` concurrency group with hil-recover.yml, and GitHub
# keeps only one *pending* run per group, so only one of the two carries a push
# trigger at a time. Recovery's is off while this one is on.

on:
  push:
    branches:
      - claude/wpc-hil-config-validation-rc62dn
    paths:
      - dev/hil/bench.py
      - dev/hil/config_matrix.py
      - .github/workflows/hil-config-matrix.yml
  workflow_dispatch:
    inputs:
      target:
        description: "Only run boards for this target, e.g. wpc (blank = every attached board)"
        type: string
        default: ""
      configs:
        description: "Comma-separated config names to run instead of all of them, e.g. AttackMars_11,Taxi_L4"
        type: string
        default: ""
      limit:
        description: "Stop after this many configs per board (blank = no limit)"
        type: string
        default: ""
      skip_flash:
        description: "Matrix what is already on the boards instead of building and flashing first"
        type: boolean
        default: false
      stop_on_first_failure:
        description: "Stop a board's matrix at its first failing config"
        type: boolean
        default: false

permissions:
  contents: read

# Flashing is destructive and the bench is one set of boards. Never interleave.
# Shares the group with the other HIL workflows on purpose.
concurrency:
  group: hil-bench
  cancel-in-progress: false

jobs:
  config-matrix:
    runs-on: [self-hosted, vector-hil]
    timeout-minutes: 180

    steps:
      # actions/checkout is safe here ONLY because every trigger above is
      # repo-internal. If a fork-reachable trigger is ever added, this must go
      # back to running from the runner's pinned clone ($VECTOR_HIL_REPO) -
      # otherwise a fork PR would execute its own harness code on the bench.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # --changed-since needs history to diff against; a shallow clone has
          # no merge base with the default branch.
          fetch-depth: 0

      - name: Prepare environment
        run: |
          test -x "$VECTOR_HIL_VENV/bin/python" || { echo "bench venv missing"; exit 1; }
          echo "$VECTOR_HIL_VENV/bin" >> "$GITHUB_PATH"

      # VECTOR_HIL_BOARD_MAP, VECTOR_HIL_WIFI_* and friends arrive from the
      # runner's .env, which the runner process exports into every job. They
      # are deliberately NOT restated in an `env:` block here: the `env`
      # context only covers workflow/job/step-level vars, so `${{ env.X }}`
      # would evaluate to empty and shadow the real value.
      - name: Boot every config on every board
        # Inputs go through the environment rather than into the script text:
        # `${{ }}` interpolation would splice a dispatcher-supplied string
        # straight into the shell.
        env:
          HIL_TARGET: ${{ inputs.target }}
          HIL_CONFIGS: ${{ inputs.configs }}
          HIL_LIMIT: ${{ inputs.limit }}
          HIL_SKIP_FLASH: ${{ inputs.skip_flash }}
          HIL_STOP_ON_FIRST_FAILURE: ${{ inputs.stop_on_first_failure }}
          HIL_EVENT: ${{ github.event_name }}
          HIL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          args=""
          if [ -n "${HIL_TARGET:-}" ]; then args="$args --target $HIL_TARGET"; fi
          if [ -n "${HIL_CONFIGS:-}" ]; then args="$args --configs $HIL_CONFIGS"; fi
          if [ -n "${HIL_LIMIT:-}" ]; then args="$args --limit $HIL_LIMIT"; fi
          if [ "${HIL_SKIP_FLASH:-}" = "true" ]; then args="$args --skip-flash"; fi
          if [ "${HIL_STOP_ON_FIRST_FAILURE:-}" = "true" ]; then args="$args --stop-on-first-failure"; fi

          # On a push, run the configs the push touched first so a bad config
          # fails in the first minute rather than the fortieth. The ref has to
          # be fetched explicitly - a checkout leaves no tracking ref for a
          # branch it did not check out.
          if [ "$HIL_EVENT" = "push" ] && git fetch --quiet origin "$HIL_DEFAULT_BRANCH"; then
            args="$args --changed-since FETCH_HEAD"
          fi

          # shellcheck disable=SC2086  # args is a deliberately word-split list
          python dev/hil/config_matrix.py $args

      - name: Board serial logs on failure
        if: failure()
        run: |
          # A board left mid-matrix may still be printing something useful;
          # grab a few seconds of console from each.
          #
          # `stty raw -echo` first, and it is not optional. A tty reverts to the
          # driver default - ECHO on - once every handle is closed, so a bare
          # `cat` makes the kernel echo the board's own output straight back at
          # it. The last run caught this happening: the boards' consoles filled
          # with "USB REQ: invalid request format: RESOURCE: RAM=69..." as they
          # parsed their own log lines as USB API requests.
          for dev in /dev/ttyACM*; do
            echo "--- $dev"
            timeout 5 stty -F "$dev" raw -echo 115200 || true
            timeout 8 cat "$dev" || true
          done
