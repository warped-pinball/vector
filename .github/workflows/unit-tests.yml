name: Unit tests

# The tests in dev/tests need no board. They cover the build and release
# tooling, the HIL helpers, and firmware logic that can run under CPython
# (for example what the web server does when a client drops mid update).
on:
  pull_request:
    paths:
      - "src/**"
      - "dev/**"
      - "tools/**"
      - ".github/workflows/unit-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dev/requirements.txt pytest

      - name: Run dev/tests
        run: python -m pytest dev/tests -q
