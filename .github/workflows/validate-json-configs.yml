name: Validate JSON configs

on:
  pull_request:
    paths:
      - "**/*.json"
      - "dev/ci/validate_json_configs.py"
      - "dev/ci/json_config_schema.py"
      - ".github/workflows/validate-json-configs.yml"

jobs:
  validate-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate JSON files and config requirements
        run: python dev/ci/validate_json_configs.py
